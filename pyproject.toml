[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baseaicore"
description = "Zero-dependency domain foundation: canonical model identity, machine profile, the Unsupported measurement sentinel, capability IDs, IDs, timestamps and the base error hierarchy."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "respx>=0.21,<1",
]

[project.urls]
Documentation = "docs/"
Changelog = "CHANGELOG.md"

[tool.hatch.version]
path = "src/baseaicore/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/baseaicore"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# `docs/` is a curated copy of the suite's central documentation (docs/README.md); ruff formats
# Python blocks inside Markdown, and reformatting a mirrored document would make it diverge from
# its source of truth for no benefit.
extend-exclude = ["docs"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
# The rule set named in docs/standards/coding-standards.md §11. Identical in every suite repository
# so that a file moving between them does not change meaning.
select = [
    "E", "W", "F", "I", "N", "D", "UP", "ANN", "B", "A", "C4", "DTZ", "T20",
    "SIM", "TID", "PTH", "ERA", "PL", "RUF", "S", "BLE", "ARG", "C901",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and compare against literal expected values (PLR2004) — that is their job.
# D1 is relaxed because a test's name is its docstring; non-obvious tests still carry one.
# ANN401: a validation test's parameters deliberately receive values of the wrong type, which is
# what `Any` means here; annotating them precisely would defeat the test.
# S311: seeded `random.Random` is how testing-standards.md §4 requires randomness to be made
# reproducible. Nothing in tests is cryptographic.
"tests/**" = ["S101", "D1", "PLR2004", "ANN401", "S311"]
# T201: scripts/ holds standalone CLI tools (doc regeneration); reporting what they did on stdout
# is their job, the exact carve-out coding-standards.md §11 names ("no print outside CLI rendering").
"scripts/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/baseaicore"]
branch = true

[tool.coverage.report]
# 95 %, not the suite-wide 85 %: this is a shared package (testing-standards.md §6, gold standard G11).
fail_under = 95
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
