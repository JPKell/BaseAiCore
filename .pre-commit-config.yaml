repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  # Type check and the fast unit subset, per coding-standards.md §11. These run from the local
  # dev environment (`pip install -e ".[dev]"`); CI re-runs everything, so a local hook is a
  # convenience and never the gate.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        pass_filenames: false
        args: [src, tests]
        types: [python]
      - id: pytest-unit
        name: pytest (unit subset)
        entry: pytest
        language: system
        pass_filenames: false
        args: [tests/unit, -q]
        types: [python]
